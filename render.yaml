# Backend on Render (Blueprint). MySQL is external (Render has no MySQL): set DB_* in the dashboard.
services:
  - type: web
    name: techcare-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # NODE_ENV=production would skip devDependencies (tsc), so include them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      # 32 random bytes, base64 — the format IMAGE_ENCRYPTION_KEY needs. Never rotate it: old signatures become unreadable.
      - key: IMAGE_ENCRYPTION_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_USE_SSL
        value: "1"
      # Provider CA certificate (PEM) when it is not publicly trusted, e.g. Aiven.
      - key: DB_SSL_CA
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: techcare-redis
          property: connectionString

  - type: keyvalue
    name: techcare-redis
    plan: free
    region: singapore
    ipAllowList: []

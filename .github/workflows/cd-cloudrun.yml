name: CD Cloud Run

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend lint, build, test
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint, build, test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:run

      - name: Frontend E2E smoke
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Validate Google auth configuration
        id: gcp-auth-config
        shell: bash
        run: |
          norm() { printf '%s' "${1//$'\r'/}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          WIF="$(norm "${GCP_WIF_PROVIDER:-}")"
          SA="$(norm "${GCP_DEPLOYER_SERVICE_ACCOUNT:-}")"
          JSON="$(norm "${GCP_CREDENTIALS_JSON:-}")"

          if [[ -n "$WIF" && -n "$JSON" ]]; then
            echo "::error::Set exactly one auth method: either GCP_WIF_PROVIDER (+ GCP_DEPLOYER_SERVICE_ACCOUNT) or GCP_CREDENTIALS_JSON."
            exit 1
          fi

          if [[ -n "$WIF" ]]; then
            if [[ -z "$SA" ]]; then
              echo "::error::Missing GCP_DEPLOYER_SERVICE_ACCOUNT while using GCP_WIF_PROVIDER."
              exit 1
            fi
            # Must use numeric project number, not PROJECT_ID (wrong format => auth invalid_target)
            if [[ ! "$WIF" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
              echo "::error::GCP_WIF_PROVIDER must be exactly: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID (PROJECT_NUMBER is digits only; get it with: gcloud projects describe PROJECT_ID --format='value(projectNumber)')."
              exit 1
            fi
            echo "mode=wif" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$JSON" ]]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Missing Google auth secrets. Configure either WIF secrets (GCP_WIF_PROVIDER + GCP_DEPLOYER_SERVICE_ACCOUNT) or GCP_CREDENTIALS_JSON on the repository or the \"production\" environment. Fork PRs and some Dependabot runs do not receive secrets."
          exit 1

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        if: steps.gcp-auth-config.outputs.mode == 'wif'
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (JSON key)
        uses: google-github-actions/auth@v2
        if: steps.gcp-auth-config.outputs.mode == 'key'
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud auth
        run: |
          gcloud --version
          gcloud auth list

      - name: Deploy backend and frontend
        shell: pwsh
        run: |
          $projectId = "${{ vars.GCP_PROJECT_ID }}"
          if ([string]::IsNullOrWhiteSpace($projectId)) {
            throw "Missing required repository variable: GCP_PROJECT_ID"
          }

          $region = "${{ vars.GCP_REGION }}"
          if ([string]::IsNullOrWhiteSpace($region)) { $region = "asia-southeast1" }

          $cloudSqlInstance = "${{ vars.CLOUDSQL_INSTANCE }}"
          if ([string]::IsNullOrWhiteSpace($cloudSqlInstance)) { $cloudSqlInstance = "techcare-mysql" }

          $dbName = "${{ vars.DB_NAME }}"
          if ([string]::IsNullOrWhiteSpace($dbName)) { $dbName = "techcare" }

          $redisHost = "${{ vars.REDIS_HOST }}"
          if ([string]::IsNullOrWhiteSpace($redisHost)) {
            throw "Missing required repository variable: REDIS_HOST"
          }

          $vpcConnectorName = "${{ vars.VPC_CONNECTOR_NAME }}"
          if ([string]::IsNullOrWhiteSpace($vpcConnectorName)) { $vpcConnectorName = "techcare-vpc-connector" }

          $apiDomain = "${{ vars.API_DOMAIN }}"
          $webDomain = "${{ vars.WEB_DOMAIN }}"
          $publicUnauthenticated = "${{ vars.PUBLIC_UNAUTHENTICATED }}"

          $args = @(
            "-ProjectId", $projectId,
            "-Region", $region,
            "-CloudSqlInstance", $cloudSqlInstance,
            "-DbName", $dbName,
            "-RedisHost", $redisHost,
            "-VpcConnectorName", $vpcConnectorName
          )

          if (-not [string]::IsNullOrWhiteSpace($apiDomain)) {
            $args += @("-ApiDomain", $apiDomain)
          }
          if (-not [string]::IsNullOrWhiteSpace($webDomain)) {
            $args += @("-WebDomain", $webDomain)
          }
          if ($publicUnauthenticated -match "^(1|true|yes)$") {
            $args += "-PublicUnauthenticated"
          }

          & "./infra/gcp/cloudrun/deploy.ps1" @args

      - name: Smoke test backend health
        shell: bash
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REGION="${GCP_REGION:-asia-southeast1}"
          PROJECT="${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          URL="$(gcloud run services describe techcare-backend --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          echo "Health check: $URL/health"
          curl -fsS "$URL/health" | head -c 800
          echo ""
          echo "Smoke test passed."

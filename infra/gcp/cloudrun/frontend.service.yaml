apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: techcare-frontend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      serviceAccountName: techcare-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/techcare/techcare-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"

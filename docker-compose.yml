services:
  mysql:
    profiles:
      - local-db
    image: mysql:8.0
    container_name: techcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techcare
      MYSQL_USER: techcare
      MYSQL_PASSWORD: techcare
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: techcare-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techcare-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-internal-ai-secret}
      # DB_* come from ./backend/.env (e.g. Aiven). Use profile `local-db` for Compose MySQL instead.
      REDIS_URL: redis://redis:6379
      CLOUDSQL_INSTANCE_CONNECTION_NAME: ""
      INSTANCE_CONNECTION_NAME: ""
      CLOUD_SQL_CONNECTION_NAME: ""
    ports:
      - "5000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techcare-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command:
      - sh
      - -c
      - npm install; npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
